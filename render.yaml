# Render blueprint. In the Render dashboard: New -> Blueprint -> this repo.
#
# Secrets are marked `sync: false`, so Render prompts for them at creation
# rather than having them sit in this file. Set them from the values you
# already hold:
#
#   DATABASE_URL         a managed Postgres URL (Neon's free tier does not expire)
#   RELAYER_SECRET_KEY   the S... key the gateway signs contract calls with
#   HASH_PEPPER          openssl rand -hex 32  (see docs/SECURITY.md)
#
# AFRICAS_TALKING_API_KEY is optional - the inbound USSD path never
# authenticates with it.
#
# STORAGE: the store is Postgres, supplied as DATABASE_URL. It used to be
# SQLite on the container filesystem, which Render's free instances do not
# persist — every restart, including waking from idle, began with an empty
# database and the dashboard's history vanished.
services:
  - type: web
    name: kobodial-gateway
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: RPC_URL
        value: https://soroban-testnet.stellar.org
      - key: NETWORK_PASSPHRASE
        value: Test SDF Network ; September 2015
      - key: CONTRACT_ID
        value: CDQKYOYWBUAFZUZIAX4YDTLWYTYWPAV3AOSCUJJ2PWNRCECVV5F6XX73
      # Prompted for at blueprint creation. Point it at a managed Postgres
      # whose free tier does not expire — Neon's does not; Render's own free
      # database is deleted after 30 days.
      - key: DATABASE_URL
        sync: false
      - key: LOG_LEVEL
        value: info
      # Prompted for at blueprint creation, never stored in the repo.
      - key: RELAYER_SECRET_KEY
        sync: false
      - key: HASH_PEPPER
        sync: false
      # Not a secret, and "sandbox" is what the simulator uses.
      - key: AFRICAS_TALKING_USERNAME
        value: sandbox
      # Optional: the USSD callback never authenticates with it, because the
      # SDK is used only to parse inbound requests. Needed once outbound
      # messaging exists.
      - key: AFRICAS_TALKING_API_KEY
        sync: false
